# ============================================================
#  Daily US Market Brief — configuration
#  每日美股研究简报 — 配置文件（改这里就能换股票、换语言）
# ============================================================

language: zh            # zh = 中文简报, en = English brief
up_color: green         # green = 美股习惯(涨绿跌红); red = A股习惯(涨红跌绿)
lookback: 1y            # history used for indicators (needs >= 200 trading days for 200DMA)

news:
  per_ticker: 2         # max headlines per ticker
  max_age_hours: 36     # ignore news older than this

llm:
  # gemini = Google Gemini API free tier (key from aistudio.google.com, no credit card)
  # other options: anthropic | openai (paid) | none (rule-based summary, no key)
  provider: gemini
  model: gemini-3.6-flash
  fallback_models: [gemini-3.8-flash, gemini-3.5-flash-lite]   # tried in order if the main model fails

signals:
  big_move_sigma: 2.0   # daily move larger than N x 20-day volatility
  volume_spike: 2.0     # volume larger than N x 20-day average
  rsi_high: 70
  rsi_low: 30
  near_52w_pct: 0.01    # within 1% of a 52-week high/low

# Friendly names for tickers that are not obvious
names:
  "^VIX": VIX 恐慌指数
  "GC=F": 黄金 Gold
  "SI=F": 白银 Silver
  "PL=F": 铂金 Platinum
  "HG=F": 铜 Copper
  "CL=F": WTI 原油
  "NG=F": 天然气 NatGas

# Each group = one section of the brief. `etf` is the sector benchmark (optional).
groups:
  - name: 大盘 Market
    tickers: [SPY, QQQ, "^VIX"]

  - name: AI 七巨头 Magnificent 7
    tickers: [NVDA, MSFT, AAPL, GOOGL, AMZN, META, TSLA]

  - name: 芯片算力 Semis & Compute
    etf: SMH
    tickers: [AMD, AVGO, TSM, ASML, MU, ARM, VRT]

  - name: 航天航空 Aerospace & Defense
    etf: ITA
    tickers: [LMT, RTX, NOC, BA, GE, RKLB]

  - name: 民生消费 Consumer Staples
    etf: XLP
    tickers: [WMT, COST, PG, KO, PEP, TGT, MCD]

  - name: 新能源 Clean Energy
    etf: ICLN
    tickers: [NEE, FSLR, ENPH, RIVN, NIO, LI]

  - name: 生物科技 Biotech
    etf: XBI
    tickers: [LLY, AMGN, VRTX, REGN, GILD, MRNA]

  - name: 贵金属与大宗商品 Metals & Commodities
    etf: DBC
    tickers: ["GC=F", "SI=F", "PL=F", "HG=F", "CL=F", "NG=F"]

# Overnight panel (pre-market brief): Asia, Europe, US futures, rates, FX, crypto.
# close = local closing time of the exchange ("24h" = trades around the clock).
overnight:
  ext_move_min: 0.015      # show after-hours / pre-market moves of at least 1.5%
  markets:
    - {ticker: "^N225",     name: 日经225 Nikkei,        region: 亚洲 Asia,    tz: Asia/Tokyo,       close: "15:30"}
    - {ticker: "^KS11",     name: 韩国综指 KOSPI,        region: 亚洲 Asia,    tz: Asia/Seoul,       close: "15:30"}
    - {ticker: "^TWII",     name: 台湾加权 TAIEX,        region: 亚洲 Asia,    tz: Asia/Taipei,      close: "13:30"}
    - {ticker: "000001.SS", name: 上证指数 Shanghai,      region: 亚洲 Asia,    tz: Asia/Shanghai,    close: "15:00"}
    - {ticker: "399001.SZ", name: 深证成指 Shenzhen,      region: 亚洲 Asia,    tz: Asia/Shanghai,    close: "15:00"}
    - {ticker: "^HSI",      name: 恒生指数 Hang Seng,     region: 亚洲 Asia,    tz: Asia/Hong_Kong,   close: "16:10"}
    - {ticker: "^STOXX50E", name: 欧洲斯托克50 STOXX 50, region: 欧洲 Europe,  tz: Europe/Berlin,    close: "17:30"}
    - {ticker: "^GDAXI",    name: 德国 DAX,              region: 欧洲 Europe,  tz: Europe/Berlin,    close: "17:30"}
    - {ticker: "^FTSE",     name: 英国富时100 FTSE,       region: 欧洲 Europe,  tz: Europe/London,    close: "16:30"}
    - {ticker: "ES=F",      name: 标普500期货 ES,         region: 美股期货 US futures, tz: America/New_York, close: "24h"}
    - {ticker: "NQ=F",      name: 纳指100期货 NQ,         region: 美股期货 US futures, tz: America/New_York, close: "24h"}
    - {ticker: "YM=F",      name: 道指期货 YM,            region: 美股期货 US futures, tz: America/New_York, close: "24h"}
    - {ticker: "^TNX",      name: 美国10年期国债收益率,    region: 利率汇率 Rates & FX, tz: America/New_York, close: "15:00", kind: yield}
    - {ticker: "DX-Y.NYB",  name: 美元指数 DXY,           region: 利率汇率 Rates & FX, tz: America/New_York, close: "24h"}
    - {ticker: "JPY=X",     name: 美元/日元 USDJPY,       region: 利率汇率 Rates & FX, tz: America/New_York, close: "24h"}
    - {ticker: "CNY=X",     name: 美元/人民币 USDCNY,     region: 利率汇率 Rates & FX, tz: America/New_York, close: "24h"}
    - {ticker: "BTC-USD",   name: 比特币 Bitcoin,         region: 加密 Crypto,  tz: UTC,              close: "24h"}
