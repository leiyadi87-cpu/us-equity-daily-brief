name: Daily US Market Brief

on:
  schedule:
    # 12:30 UTC Mon–Fri = 7:30am ET (winter) / 8:30am ET (summer) = 4:30am / 5:30am PT
    # GitHub cron is UTC and can start a few minutes late.
    - cron: "30 12 * * 1-5"
  workflow_dispatch:        # "Run workflow" button for manual runs

permissions:
  contents: write           # lets the job commit reports/ back to the repo

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send brief
        run: python main.py
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Archive report in repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet || git commit -m "brief: $(date -u +%F)"
          git push
