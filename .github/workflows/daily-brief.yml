name: Daily US Market Brief

# Pre-market brief: previous session's official close + after-hours, Asia close,
# Europe so far, US futures, rates/FX — sent once per US trading morning.
#
# Triggers
# - workflow_dispatch: the primary trigger. A Claude scheduled task starts it every
#   weekday at ~05:43 ET (GitHub's own cron has been starting 7+ hours late).
#   Pass force=true to send again even if today's brief already went out.
# - schedule: backup only, in case the primary trigger doesn't fire. Several slots;
#   whichever runs first sends the brief and the rest exit (--once-per-day).
#   Times are UTC: 10:41 UTC = 05:41 ET (winter) / 06:41 ET (summer).
on:
  workflow_dispatch:
    inputs:
      force:
        description: "Send even if today's brief was already sent"
        type: boolean
        default: false
      dry_run:
        description: "Build the report only (no email, no commit); download it from the run's artifacts"
        type: boolean
        default: false
  schedule:
    - cron: "41 10 * * 1-5"
    - cron: "17 11 * * 1-5"
    - cron: "53 11 * * 1-5"

permissions:
  contents: write           # lets the job commit reports/ back to the repo

concurrency:                # never run two briefs at the same time
  group: daily-brief
  cancel-in-progress: false

jobs:
  brief:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # a queued run may have been triggered before an earlier run pushed today's marker
      - name: Get latest reports
        run: git pull --ff-only origin "${GITHUB_REF_NAME}"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Build and send brief
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python main.py --no-email
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.force }}" = "true" ]; then
            python main.py
          else
            python main.py --once-per-day
          fi
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}         # free, from aistudio.google.com
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}   # optional, paid
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}         # optional, paid
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
          EMAIL_USER: ${{ secrets.EMAIL_USER }}
          EMAIL_APP_PASSWORD: ${{ secrets.EMAIL_APP_PASSWORD }}
          EMAIL_TO: ${{ secrets.EMAIL_TO }}

      - name: Show report in log (dry run)
        if: ${{ inputs.dry_run }}
        run: |
          f=$(ls -t reports/*.md | head -1); cat "$f"
          python - <<'PY'
          import glob, json, os
          f = max(glob.glob("reports/*.json"), key=os.path.getmtime)
          o = json.load(open(f))["overnight"]
          print("generated", o["generated_et"], "phase", o["phase"], "session", o["session"], "errors", o["errors"])
          for r in o["global"]:
              print(r["name"], round(r["last"], 2), r.get("pct"), r.get("chg_bp"), r["status_label"], r["date"])
          for t, e in sorted(o["extended"].items(), key=lambda kv: -abs(kv[1]["latest_pct"]))[:15]:
              print(t, e)
          PY

      - name: Upload report (dry run)
        if: ${{ inputs.dry_run }}
        uses: actions/upload-artifact@v4
        with:
          name: dry-run-report
          path: reports/

      - name: Archive report in repo
        if: ${{ !inputs.dry_run }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add reports/
          git diff --cached --quiet && exit 0
          git commit -m "brief: $(TZ=America/New_York date +%F)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push

  # Keep the schedule alive. GitHub switches off scheduled workflows in public
  # repos after 60 days with no repository activity. The daily report commit
  # above already counts as activity; this job is a second safeguard that also
  # runs when the brief job fails (so no commit was made that day). It
  # re-enables this (already enabled) workflow through the GitHub API, which
  # resets the inactivity clock without making a dummy commit.
  keepalive:
    needs: brief
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write
    steps:
      - name: Re-enable this workflow
        run: gh api -X PUT "repos/${{ github.repository }}/actions/workflows/daily-brief.yml/enable"
        env:
          GH_TOKEN: ${{ github.token }}
