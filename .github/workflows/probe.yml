name: probe
on: workflow_dispatch
permissions: {contents: read}
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q yfinance pandas
      - run: |
          python3 - <<'PY'
          import yfinance as yf, pandas as pd
          pd.set_option("display.width", 200)
          t = yf.Ticker("SPY")
          print("== history 5d"); print(t.history(period="5d")[["Close","Volume"]])
          print("== download"); print(yf.download("SPY", period="5d", progress=False, auto_adjust=True).tail(3))
          fi = t.fast_info
          print("== fast_info", fi.get("lastPrice"), fi.get("previousClose"), fi.get("regularMarketPreviousClose"), fi.get("lastVolume"))
          md = t.history_metadata
          print("== meta", {k: md.get(k) for k in ("regularMarketPrice","regularMarketTime","chartPreviousClose","exchangeTimezoneName")})
          print("== 1h bars"); print(t.history(period="2d", interval="1h")[["Close"]].tail(3))
          PY
